# TIVRA News — scheduled auto-publisher.
# Runs in GitHub's cloud: your PC can be off. Every run generates fresh
# articles, cleans up old ones, and pushes — Cloudflare then rebuilds the
# live site automatically (~1 minute).
#
# CHANGE THE SCHEDULE: edit the cron line below. Examples:
#   "0 */6 * * *"   every 6 hours (current)
#   "0 */4 * * *"   every 4 hours
#   "0 */12 * * *"  twice a day
#   "30 2 * * *"    once a day at 08:00 IST (02:30 UTC)
# Cron times are UTC (IST = UTC+5:30).
#
# RUN IT NOW (single click): GitHub → Actions → "TIVRA auto news" →
# "Run workflow". Optionally set a per-category override for a small test.

name: TIVRA auto news

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:
    inputs:
      per_category:
        description: "Articles per category this run (blank = config default)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: tivra-auto-news
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Generate articles + cleanup
        env:
          POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          ADSENSE_PUBLISHER_ID: ${{ secrets.ADSENSE_PUBLISHER_ID }}
          ADSENSE_AD_SLOT: ${{ secrets.ADSENSE_AD_SLOT }}
        run: |
          EXTRA=""
          if [ -n "${{ github.event.inputs.per_category }}" ]; then
            EXTRA="--per-category ${{ github.event.inputs.per_category }}"
          fi
          node scripts/auto-news.mjs $EXTRA

      - name: Publish incoming uploads with TIVRA branding
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: node scripts/rebrand.mjs

      - name: Self-heal broken or generic images
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
        run: node scripts/reimage.mjs --budget 60

      - name: Sanity-check the site still builds
        run: npm run build

      - name: Commit and push
        run: |
          git config user.name "tivra-news-bot"
          git config user.email "actions@github.com"
          git add articles/ data/ incoming/
          if git diff --cached --quiet; then
            echo "Nothing new this run."
            exit 0
          fi
          COUNT=$(git diff --cached --numstat | wc -l)
          git commit -m "TIVRA auto news: $(date -u +'%Y-%m-%d %H:%M UTC') ($COUNT file changes)"
          # Retry once with a rebase in case another push landed mid-run.
          git push || (git pull --rebase && git push)

      - name: Purge Cloudflare Edge Cache
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID || 'f13e234315fbf412f4e2dc908ea85119' }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "Purging Cloudflare cache for zone $CLOUDFLARE_ZONE_ID..."
            curl -s -X POST "https://api.cloudflare.com/client/v4/zones/${CLOUDFLARE_ZONE_ID}/purge_cache" \
              -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              -H "Content-Type: application/json" \
              -d '{"purge_everything": true}' || true
            echo "Cloudflare cache purge requested."
          else
            echo "CLOUDFLARE_API_TOKEN not set in GitHub secrets — skipping automated purge."
          fi

      - name: Verify Live Site Health
        run: |
          sleep 45
          node -e "
          async function verify() {
            const today = new Date().toISOString().slice(0, 10);
            try {
              const res = await fetch('https://tivranews.com/api/feed?page=1&limit=5&_t=' + Date.now());
              if (!res.ok) throw new Error('Live API returned status ' + res.status);
              const data = await res.json();
              const latestDate = data.articles?.[0]?.date;
              console.log('Live feed check — Newest article date:', latestDate, '(Today is ' + today + ')');
              if (latestDate !== today) {
                console.warn('⚠️ Warning: Live site latest date does not match today. Check deployment logs.');
              } else {
                console.log('✅ Live site is healthy and serving today\'s articles.');
              }
            } catch (err) {
              console.warn('Live health check request error:', err.message);
            }
          }
          verify();
          "

      - name: Dispatch top stories to distribution channels
        env:
          ONESIGNAL_APP_ID: ${{ secrets.ONESIGNAL_APP_ID }}
          ONESIGNAL_REST_API_KEY: ${{ secrets.ONESIGNAL_REST_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: node scripts/distribute.mjs
