<script>
(function(){
  try {
    var tz = Intl.DateTimeFormat().resolvedOptions().timeZone || "";
    var lang = (navigator.language || "").toUpperCase();
    var isIndia = tz === "Asia/Kolkata" || tz === "Asia/Calcutta" || lang.endsWith("-IN");
    if (!isIndia) {
      var links = document.querySelectorAll('a[href*="amazon.in"]');
      for (var i = 0; i < links.length; i++) {
        links[i].href = links[i].href.replace(/https?:\/\/(www\.)?amazon\.in/i, "https://www.amazon.com");
      }
    }
  } catch(e) {}
})();
