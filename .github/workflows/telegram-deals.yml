name: TIVRA Deals Telegram Broadcast

on:
  schedule:
    # 2 Prime Drops per day at peak Indian shopping hours (10:15 AM IST & 08:15 PM IST)
    # Perfectly buffered between auto-news runs (04:15 & 14:15 UTC) to ensure 0% collision
    - cron: "45 4,14 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "Number of product deals to post this run (default 20)"
        required: false
        default: "200"

permissions:
  contents: write

concurrency:
  group: tivra-telegram-deals
  cancel-in-progress: false

jobs:
  broadcast-deals:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Broadcast top national & international product deals to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || '8725425068:AAE3MzMTEMcu1PjMVqpCbwesPjH_rkV5hLg' }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID || '@tivranews_official' }}
          CUELINKS_API_KEY: ${{ secrets.CUELINKS_API_KEY || 'xnrsT6vr3TP64MM7FSvCvdwY2jvD_jLrwU7B0zXvReI' }}
        run: |
          LIMIT="${{ github.event.inputs.limit || '200' }}"
          node scripts/telegram-deals.mjs --limit "$LIMIT" --digest

      - name: Save dispatched state
        run: |
          git config user.name "tivra-deals-bot"
          git config user.email "actions@github.com"
          git add data/telegram-deals-dispatched.json || true
          if git diff --cached --quiet; then
            echo "No state updates to commit."
            exit 0
          fi
          git commit -m "chore(deals): update telegram dispatched state [skip ci]"
          # Retry push up to 5 times with clean rebase so concurrent pushes never conflict
          for i in {1..5}; do
            if git push origin main; then
              echo "Pushed successfully."
              break
            fi
            echo "Push contention detected (attempt $i/5). Rebasing..."
            sleep $((RANDOM % 5 + 2))
            git rebase --abort 2>/dev/null || true
            git pull --rebase origin main || {
              git rebase --abort 2>/dev/null || true
              git fetch origin main
              git reset --soft origin/main
              git add data/telegram-deals-dispatched.json || true
              git commit -m "chore(deals): update telegram dispatched state [skip ci]" || true
            }
          done
